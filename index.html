<html>
    <head>
        <title>Personal Profile</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
    </head>
    
    <body class="form-page">
        <!--main container-->
        <div class="profile-card">
            <!-- header section -->
            <header class="page-header">
                <div class="header-box">
                    <h1>PERSONAL PROFILE</h1>
                    <div class="welcome-text">
                        <p>Welcome!</p>
                        <p>Please complete your personal information below.</p>
                    </div>
                </div>
            </header>
        
            <!--personal profile form -->
            <main class="form-container">
                <form action="ProfileServlet" method="POST">
                    <!-- full name -->
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <!-- student ID -->
                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID" required>
                    </div>
                    <!-- programme -->
                    <div class="form-group">
                        <label for="programme">Programme</label>
                        <input type="text" id="programme" name="programme" placeholder="Enter your programme" required>
                    </div>
                    <!-- email Address -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    </div>
                    <!-- hobbies -->
                    <div class="form-group">
                        <label for="hobbies">Hobbies</label>
                        <input type="text" id="hobbies" name="hobbies" placeholder="e.g. reading, painting, shopping" required>
                    </div>
                    <!-- self introduction -->
                    <div class="form-group introduction-group">
                        <label for="introduction">Short Self-Introduction</label>
                        <textarea id="introduction" name="introduction" rows="5" placeholder="Tell us a little about yourself" required></textarea>
                    </div>
                
                    <!-- form buttons -->
                    <div class="button-group">
                        <button type="submit" class="submit-btn">
                            Submit Profile
                        </button>
                        <button type="reset" class="reset-btn">
                            Reset Form
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </body>
</html>
